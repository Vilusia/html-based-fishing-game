<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protogen sign editor preview</title><link rel="stylesheet" href="../protogen-logo.css"><style>body{margin:0;background:#172233;color:#eef6ff;font:14px sans-serif;--p-sunken:#172b42;--p-line:#080f1a}main{width:min(390px,calc(100% - 32px));margin:24px auto;background:#243b53;border-radius:12px;padding:16px;box-sizing:border-box}h1{font-size:20px}.picker-row{display:flex;gap:8px;align-items:center;margin:12px 0}.picker-row select{flex:1;min-width:0}button,select,input{min-height:36px;background:#295372;color:white;border:1px solid #78b8df;border-radius:6px;padding:6px}#preview{height:300px}#preview canvas{width:100%!important;height:100%!important}p{font-size:12px;color:#bcd2e4}</style></head><body><main><h1>Character shop · sign preview</h1><div class="picker-row"><label for="misc-select">Extras:</label><select id="misc-select"><option value="protogen_visor">Protogen Side Circles &amp; Fins</option><option value="none">None</option></select><input type="color" id="eye" value="#60ee22" aria-label="Eye color"></div><div id="protogen-logo-row" hidden><span>Protogen sign</span><button id="protogen-logo-button" onclick="ProtogenLogo.open()">Draw sign</button></div><div id="preview"></div><button id="example">Example sign</button><p id="saved">Nothing saved yet.</p></main><script src="../vendor/three.min.js"></script><script src="../protogen-logo.js"></script><script src="../character3d.js"></script><script>
const saveState={currentMisc:'protogen_visor',eyeColor:'#60ee22',catColor:'#dce6f0',miscColor:'#73869c',protogenLogo:''};let player=null;
function saveGame(){document.getElementById('saved').textContent='Saved sign: '+(saveState.protogenLogo?'32 × 32 pixels':'plain circle');}
const renderer=new THREE.WebGLRenderer({antialias:true}),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1.2,.1,100);renderer.setSize(360,300);renderer.setClearColor('#172233');document.getElementById('preview').append(renderer.domElement);camera.position.set(4,1,4);camera.lookAt(0,.2,0);scene.add(new THREE.AmbientLight(0xffffff));let model=null;
function updateCharacterPreview(){if(model)scene.remove(model);const tex=()=>new THREE.DataTexture(new Uint8Array([16,25,35,255]),1,1,THREE.RGBAFormat);model=Character3D.buildCharacter({eye:saveState.eyeColor,protogenLogo:saveState.protogenLogo},{base:saveState.catColor,belly:'#fff',pc:{miscColor:saveState.miscColor},parts:{ears:'protogen',eyes:'standard',nose:'protogen',tail:'none',misc:saveState.currentMisc}},{headFront:tex(),headBack:tex(),torsoFront:tex(),torsoBack:tex()});scene.add(model);renderer.render(scene,camera);}
document.getElementById('misc-select').onchange=e=>{saveState.currentMisc=e.target.value;ProtogenLogo.syncButton();updateCharacterPreview();};document.getElementById('eye').onchange=e=>{saveState.eyeColor=e.target.value;updateCharacterPreview();};document.getElementById('example').onclick=()=>{const b=new Uint8Array(1024);ProtogenLogo.stroke(b,{x:9,y:9},{x:23,y:23},1.5,1);ProtogenLogo.stroke(b,{x:23,y:9},{x:9,y:23},1.5,1);saveState.protogenLogo=ProtogenLogo.encode(b);ProtogenLogo.syncButton();updateCharacterPreview();};ProtogenLogo.syncButton();updateCharacterPreview();
</script></body></html>
