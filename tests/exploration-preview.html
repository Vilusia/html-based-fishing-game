<!doctype html><html lang="en"><meta charset="utf-8"><title>Custom Island Shores</title>
<style>body{margin:0;padding:24px;background:#191b26;color:#e8ecf7;font:16px system-ui}h1{font-size:25px;margin:0 0 8px}p{color:#9aa3c0}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#232636;border:1px solid #565d7d;padding:18px}img{width:100%;display:block}h2{font-size:18px}small{color:#d9b26a}</style>
<h1>Custom island shores</h1><p>Shared terrain and mesh preview. The default map’s island shapes stay unchanged.</p><main id="gallery"></main>
<script src="../vendor/three.min.js"></script><script src="../worldgen.js"></script><script src="../ocean.js"></script>
<script>
const original=Ocean.layoutAround(256,0,-6).islands.find(i=>i.radius>55),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(740,540);renderer.outputEncoding=THREE.sRGBEncoding;
for(const updated of [false,true]){
 const island={...original,x:0,z:0,radius:48,xScale:1.2,zScale:.9,peak:7,squash:1,rotation:.3,ponds:[],profile:updated?'coastal':undefined};
 const scene=new THREE.Scene();scene.background=new THREE.Color('#9dc6d0');scene.add(new THREE.HemisphereLight('#e4f0ff','#6a604a',.55));const sun=new THREE.DirectionalLight('#fff1cf',.65);sun.position.set(-80,130,60);scene.add(sun);scene.add(Ocean.buildIslandMesh(island));
 const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:'#3a92ac',transparent:true,opacity:.85,roughness:.5}));water.rotation.x=-Math.PI/2;water.position.y=.025;scene.add(water);
 const camera=new THREE.PerspectiveCamera(39,740/540,.1,1000);camera.position.set(93,77,107);camera.lookAt(0,0,0);renderer.render(scene,camera);
 const card=document.createElement('article'),title=document.createElement('h2');title.textContent=updated?'Updated custom island':'Previous custom island';card.append(title);const img=document.createElement('img');img.alt=title.textContent;img.src=renderer.domElement.toDataURL();card.append(img);const note=document.createElement('small');note.textContent=updated?'Broad beach, grassy plateau, irregular shoreline':'Dome slope and smaller dry footprint';card.append(note);gallery.append(card);
}
renderer.dispose();
</script>
<div id="lobby-screen" style="display:none"></div>
<script>
window.player=new THREE.Group();window.scene=new THREE.Scene();window.myPeerId='preview';window.currentRoomId='preview';window.isHost=false;window.hostConn={open:true,send(){}};window.clientConns={};
window.isInVoid=false;window.isInLavaWorld=false;
</script>
<script src="../exploration.js"></script>
<script>
Exploration.host({type:'explore:state',session:'preview',revision:0,finds:[{id:'p',type:'pouch',x:-1.25,y:0,z:0,amount:100},{id:'b',type:'bottle',x:0,y:0,z:0,amount:200},{id:'c',type:'cache',x:1.25,y:0,z:0,amount:500}]});
scene.background=new THREE.Color('#232636');scene.add(new THREE.HemisphereLight('#dceeff','#604d36',.7));const fill=new THREE.DirectionalLight('#fff1d5',.7);fill.position.set(-3,4,5);scene.add(fill);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1200,340);r.outputEncoding=THREE.sRGBEncoding;const view=new THREE.PerspectiveCamera(30,1200/340,.01,30);view.position.set(2,2.2,5.5);view.lookAt(0,.3,0);r.render(scene,view);
const article=document.createElement('article');article.style.gridColumn='1 / -1';article.innerHTML='<h2>Shared exploration finds</h2><p>Coin pouch · drift bottle · treasure cache</p>';const photo=document.createElement('img');photo.alt='Coin pouch, drift bottle and treasure cache models';photo.src=r.domElement.toDataURL();article.append(photo);gallery.append(article);r.dispose();
</script></html>
